<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>滿願塔小故事 3D 互動立體繪本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style id="app-style">
:root{--jade:#2f9e6e;--deep:#062823;--gold:#e8c36a;--cream:#fff8e8;--ink:#123a31}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#04201c;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--cream);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
#stage{position:fixed;inset:0;overflow:hidden}
#bgBlur{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(20px) brightness(.62) saturate(1.15)}
#homeImg{position:absolute;display:block;transition:opacity 1s ease;pointer-events:none}
#homeImg.off{opacity:0}
#gl{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;touch-action:none}
#gl.on{opacity:1;pointer-events:auto}
#gl.fadeout{transition:opacity .6s}
#home{position:absolute;inset:0;transition:opacity .6s}
#home.off{opacity:0;pointer-events:none}
.home-title{position:absolute;left:clamp(14px,3vw,36px);top:clamp(12px,2.4vw,28px);text-shadow:0 2px 12px rgba(0,0,0,.7);pointer-events:none}
.home-title h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(22px,3.2vw,42px);letter-spacing:.12em;color:#ffe8a8}
.home-title p{font-size:clamp(12px,1.3vw,16px);letter-spacing:.3em;opacity:.9;margin-top:4px}
.home-tip{position:absolute;left:50%;transform:translateX(-50%);bottom:clamp(10px,2.4vh,26px);padding:8px 18px;border-radius:99px;background:rgba(6,40,35,.72);border:1px solid rgba(232,195,106,.6);font-size:clamp(13px,1.4vw,16px);letter-spacing:.08em;white-space:nowrap;pointer-events:none;animation:tipfloat 2.4s ease-in-out infinite}
@keyframes tipfloat{50%{transform:translate(-50%,-5px)}}
.book-hot{position:absolute;background-size:100% 100%;border-radius:4px 10px 10px 4px;box-shadow:0 10px 26px rgba(0,0,0,.45),0 0 0 2px rgba(232,195,106,.75),0 0 26px 4px rgba(255,214,140,.25);transition:transform .38s cubic-bezier(.3,1.7,.5,1),box-shadow .38s;animation:breath 3.2s ease-in-out infinite;outline:none}
.book-hot:hover,.book-hot.hover,.book-hot:focus-visible{transform:translateY(-14px) scale(1.035);box-shadow:0 22px 44px rgba(0,0,0,.55),0 0 0 3px rgba(255,220,130,.95),0 0 60px 16px rgba(255,214,140,.65);animation:none}
.book-hot.hidden{visibility:hidden}
@keyframes breath{50%{box-shadow:0 10px 26px rgba(0,0,0,.45),0 0 0 2px rgba(232,195,106,.95),0 0 40px 10px rgba(255,214,140,.45)}}
.cover-badge{position:absolute;right:-14px;top:-14px;width:clamp(54px,6vw,78px);display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));pointer-events:none}
.cover-badge svg{width:100%;height:auto}
.cover-badge b{margin-top:-4px;font-size:11px;background:#7a4a10;color:#ffe9b0;padding:2px 7px;border-radius:99px;white-space:nowrap}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#ui{position:fixed;inset:0;pointer-events:none;z-index:20}
#ui .bar{pointer-events:auto}
.bar{position:absolute;top:12px;display:flex;gap:8px;align-items:center}
.bar.left{left:12px}.bar.right{right:12px}
.pill-btn{height:40px;padding:0 14px;border-radius:99px;background:rgba(6,40,35,.78);border:1px solid rgba(232,195,106,.55);font-size:14px;font-weight:700;letter-spacing:.04em;display:inline-flex;align-items:center;gap:6px;backdrop-filter:blur(6px);transition:transform .15s,background .2s}
.pill-btn:hover{transform:translateY(-2px);background:rgba(16,70,58,.9)}
.pill-btn:disabled{opacity:.45;cursor:default;transform:none}
.pill-btn.round{width:40px;padding:0;justify-content:center;font-size:18px}
.pill-btn.rec-on{background:#b3261e;border-color:#ffb4ab}
.pill-btn.off{opacity:.55;text-decoration:line-through}
#btnBack[hidden],#pageInfo[hidden]{display:none}
#pageInfo{font-size:13px;padding:6px 12px;border-radius:99px;background:rgba(6,40,35,.55);letter-spacing:.05em;pointer-events:none}
.sub{position:absolute;left:50%;bottom:clamp(14px,3vh,30px);transform:translateX(-50%) translateY(20px);width:min(860px,calc(100vw - 24px));min-height:84px;padding:16px 22px 14px;border-radius:20px;background:rgba(7,38,33,.86);border:2px solid rgba(232,195,106,.7);box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;cursor:pointer}
.sub.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.sub .who{position:absolute;top:-15px;left:20px;padding:3px 14px;border-radius:99px;font-weight:700;font-size:15px;color:#08251f;letter-spacing:.1em;background:var(--gold)}
.sub .txt{font-size:clamp(17px,2.1vw,23px);line-height:1.6;letter-spacing:.04em;min-height:1.6em}
.sub .skip{position:absolute;right:16px;bottom:6px;font-size:11px;opacity:.5}
.hint{position:absolute;left:50%;bottom:clamp(22px,5vh,44px);transform:translateX(-50%) scale(.8);padding:12px 24px;border-radius:99px;background:#ffd977;color:#2a1c00;font-weight:700;font-size:clamp(16px,2vw,20px);letter-spacing:.06em;box-shadow:0 0 0 4px rgba(255,217,119,.35),0 8px 24px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.3,1.7,.5,1);white-space:nowrap}
.hint.show{opacity:1;transform:translateX(-50%) scale(1);pointer-events:auto;animation:hintpulse 1.6s ease-in-out infinite}
@keyframes hintpulse{50%{box-shadow:0 0 0 12px rgba(255,217,119,0),0 8px 24px rgba(0,0,0,.35)}}
.next{position:absolute;right:clamp(12px,3vw,32px);bottom:clamp(16px,4vh,40px);padding:13px 24px;border-radius:99px;background:#2f9e6e;border:2px solid #bff5d6;font-weight:700;font-size:18px;letter-spacing:.08em;box-shadow:0 8px 22px rgba(0,0,0,.35);opacity:0;pointer-events:none;transform:translateY(16px);transition:opacity .25s,transform .25s}
.next.show{opacity:1;pointer-events:auto;transform:none}
.orbit-tip{position:absolute;left:50%;bottom:clamp(16px,4vh,40px);transform:translateX(-50%);font-size:13px;padding:6px 14px;border-radius:99px;background:rgba(6,40,35,.6);opacity:0;transition:opacity .3s;pointer-events:none!important;white-space:nowrap}
.orbit-tip.show{opacity:.9}
.card{position:absolute;left:50%;transform:translate(-50%,24px);width:min(620px,calc(100vw - 24px));padding:22px 22px 20px;border-radius:24px;background:rgba(7,38,33,.9);border:2px solid rgba(232,195,106,.8);box-shadow:0 16px 40px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s,transform .35s cubic-bezier(.3,1.5,.5,1);text-align:center}
.card.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.quiz{top:62px}
.quiz h3{font-size:clamp(18px,2.3vw,24px);line-height:1.5;margin-bottom:16px;letter-spacing:.04em}
.quiz .opts{display:flex;gap:12px}
.quiz .opts button{flex:1;padding:14px 12px;border-radius:16px;background:#fff6dc;color:#2a2205;font-weight:700;font-size:clamp(15px,1.9vw,19px);line-height:1.45;border:3px solid #e8c36a;transition:transform .15s,background .2s}
.quiz .opts button:hover{transform:translateY(-3px);background:#fff}
.quiz .opts button b{display:inline-block;width:30px;height:30px;line-height:30px;border-radius:50%;background:#2f9e6e;color:#fff;margin-right:6px}
.quiz .opts button.wrong{animation:shake .45s;background:#ffd6d0;border-color:#e57368}
.quiz .opts button.right{background:#c9f5d9;border-color:#2f9e6e}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.ending{bottom:clamp(12px,3vh,28px);display:flex;align-items:center;gap:16px;text-align:left;width:min(680px,calc(100vw - 24px));padding:16px 20px}
.ending .txtcol{flex:1}
@media (max-width:560px){.ending{flex-direction:column;text-align:center}}
.ending .medal{width:96px;display:block;flex:none}
.ending h2{font-family:"Noto Serif TC",serif;font-size:clamp(22px,3vw,30px);color:#ffe39a;letter-spacing:.1em}
.ending p{margin:6px 0 12px;font-size:16px;opacity:.92;line-height:1.6}
.ending .row{display:flex;gap:12px;flex-wrap:wrap}
@media (max-width:560px){.ending .row{justify-content:center}}
.ending .row button{padding:12px 22px;border-radius:99px;font-weight:700;font-size:17px;background:#2f9e6e;border:2px solid #bff5d6}
.ending .row button.alt{background:transparent;border-color:#e8c36a}
#toast{position:absolute;left:50%;top:64px;transform:translate(-50%,-10px);padding:10px 18px;border-radius:12px;background:rgba(10,30,26,.92);border:1px solid rgba(232,195,106,.6);font-size:14px;opacity:0;pointer-events:none!important;transition:opacity .25s,transform .25s;max-width:calc(100vw - 24px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#recBadge{position:absolute;right:14px;top:60px;padding:4px 10px;border-radius:8px;background:#b3261e;font-size:12px;font-weight:700;letter-spacing:.05em;display:none;pointer-events:none!important}
#recBadge.show{display:block}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#04201c;z-index:100;font-size:16px;letter-spacing:.1em;transition:opacity .6s}
#loading.done{opacity:0;pointer-events:none}
#loading .spin{width:42px;height:42px;border-radius:50%;border:4px solid rgba(232,195,106,.25);border-top-color:#e8c36a;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;z-index:60;background:rgba(2,14,12,.72);display:flex;align-items:center;justify-content:center;padding:12px;-webkit-user-select:text;user-select:text}
.modal[hidden]{display:none}
.panel{width:min(980px,100%);max-height:calc(100vh - 24px);display:flex;flex-direction:column;border-radius:20px;background:#0b2f29;border:2px solid rgba(232,195,106,.7);box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden}
.panel header{padding:16px 20px 10px;border-bottom:1px solid rgba(232,195,106,.3)}
.panel header h2{font-size:20px;letter-spacing:.08em;color:#ffe39a}
.panel header p{font-size:13px;line-height:1.7;opacity:.85;margin-top:6px}
.panel .groups{overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:12px}
.panel footer{padding:12px 16px;border-top:1px solid rgba(232,195,106,.3);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.panel footer .note{margin-right:auto;font-size:12px;opacity:.75}
.grp{border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);padding:12px}
.grp h4{font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grp h4 .tag{font-size:12px;padding:2px 10px;border-radius:99px;color:#08251f;background:#e8c36a}
.grp h4 .st{font-size:12px;font-weight:500;opacity:.8}
.grp textarea{width:100%;margin-top:8px;height:74px;resize:vertical;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);color:#fff;font:13px/1.6 "Noto Sans TC",sans-serif;padding:8px}
.grp .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.btn-s{padding:7px 14px;border-radius:99px;background:#2f9e6e;font-size:13px;font-weight:700;border:1px solid #bff5d6}
.btn-s.alt{background:transparent;border-color:#e8c36a}
.btn-s.file{position:relative;overflow:hidden}
.btn-s.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.segs{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.seg{display:grid;grid-template-columns:34px 1fr 76px 76px;gap:6px;align-items:center;font-size:13px}
.seg button{width:30px;height:26px;border-radius:8px;background:#e8c36a;color:#2a1c00;font-weight:700}
.seg input{width:100%;padding:3px 4px;border-radius:6px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.3);color:#fff;font-size:12px}
.seg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wave{width:100%;height:46px;margin-top:8px;border-radius:8px;background:rgba(0,0,0,.3);display:block}
@media (max-width:640px){#pageInfo{position:fixed;top:58px;left:12px;max-width:calc(100vw - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill-btn .lbl{display:none}.pill-btn{padding:0 11px}.seg{grid-template-columns:30px 1fr 60px 60px}}
</style>
</head>
<body>
<div id="app">
<div id="stage">
  <div id="bgBlur"></div>
  <img id="homeImg" alt="尼泊爾滿願塔（博達大塔）晨光中的首頁照片">
  <canvas id="gl"></canvas>
  <div id="home">
    <div class="home-title"><h1>滿願塔小故事</h1><p>3D 互動立體繪本</p></div>
    <div id="hots"></div>
    <div class="home-tip">點一點發光的書，開始聽故事</div>
  </div>
</div>
<canvas id="fx"></canvas>
<div id="ui">
  <div class="bar left"><button id="btnBack" class="pill-btn" hidden>⟵ <span class="lbl">回書架</span></button><div id="pageInfo" hidden></div></div>
  <div class="bar right">
    <button id="btnVoice" class="pill-btn" title="匯入語音">🎙 <span class="lbl">匯入語音</span></button>
    <button id="btnRec" class="pill-btn" title="錄影">⏺ <span class="lbl">錄影</span></button>
    <button id="btnMusic" class="pill-btn round" title="音樂開關" aria-label="音樂開關">🎵</button>
  </div>
  <div id="recBadge">● REC 00:00</div>
  <div id="sub" class="sub" role="status"><span class="who"></span><p class="txt"></p><span class="skip">點一下跳過 ›</span></div>
  <button id="hint" class="hint">👆 <span></span></button>
  <div id="orbitTip" class="orbit-tip">可以拖曳旋轉、滾輪縮放，自由看看喔</div>
  <button id="next" class="next">下一頁 ▶</button>
  <div id="quiz" class="card quiz"><h3></h3><div class="opts"><button data-i="0"></button><button data-i="1"></button></div></div>
  <div id="ending" class="card ending"><div id="endMedal"></div><div class="txtcol"><h2></h2><p></p><div class="row"><button id="btnAgain">再讀一次</button><button id="btnHome" class="alt">回書架</button></div></div></div>
  <div id="toast"></div>
</div>
<div id="voicePanel" class="modal" hidden>
  <div class="panel">
    <header>
      <h2>🎙 匯入語音</h2>
      <p>台詞已依角色分組（每組最多 10 句、約 380 字），句與句之間插入 <code>[pause=long]</code>。① 按「複製台詞」貼到語音工具產生音檔（例如 VoAI 的台語 Mosa 模型），② 下載 MP3 後按「選擇音檔」，程式會依停頓自動切成一句一句，可逐句試聽與微調起訖秒數，③ 最後按「匯出新的 HTML」，語音就內嵌在新檔案裡。</p>
    </header>
    <div class="groups" id="vgGroups"></div>
    <footer>
      <span class="note" id="vgNote"></span>
      <button class="btn-s alt" id="vgClear">清除全部語音</button>
      <button class="btn-s" id="vgExport">匯出新的 HTML</button>
      <button class="btn-s alt" id="vgClose">關閉</button>
    </footer>
  </div>
</div>
<div id="loading"><div class="spin"></div><div id="loadMsg">繪本準備中…</div></div>

      "opening": {"id": "st_open", "speaker": "旁白", "text": "我們一起翻開《滿願塔》，聽聽願望圓滿的故事吧！"},

          "id": "st1", "name": "媽媽的心願", "target": "bag", "hint": "點一點媽媽的錢袋",
          "intro": [
            {"id": "st1_01", "speaker": "旁白", "text": "很久很久以前，有一位媽媽，靠著養雞、賣雞，照顧三個孩子。"},
            {"id": "st1_02", "speaker": "媽媽", "text": "這些錢，我想拿來做一件好事。"},
            {"id": "st1_03", "speaker": "媽媽", "text": "我們來蓋一座塔，讓大家都能來祈福吧！"}
          ],
          "outro": [
            {"id": "st1_04", "speaker": "旁白", "text": "金幣變成金光，飛向了國王的宮殿。"},
            {"id": "st1_05", "speaker": "國王", "text": "好呀！你要多少土地都可以！"},
            {"id": "st1_06", "speaker": "小弟", "text": "太好了！我們可以蓋塔了！"}
          ]
        },
        {
          "id": "st2", "name": "說話算話的國王", "target": "king", "hint": "點一點國王",
          "intro": [
            {"id": "st2_01", "speaker": "旁白", "text": "媽媽帶著三個兒子，每天一起搬石頭、蓋塔。"},
            {"id": "st2_02", "speaker": "旁白", "text": "塔蓋到一層樓那麼高，又大又漂亮。"},
            {"id": "st2_03", "speaker": "大臣", "text": "哎呀，這座塔太大了，比王宮還氣派，快叫他們拆掉！"}
          ],
          "outro": [
            {"id": "st2_04", "speaker": "國王", "text": "我答應過了，就不能反悔！"},
            {"id": "st2_05", "speaker": "旁白", "text": "所以這座塔又叫「加卡倫卡」，意思是「國王答應了，不反悔」。"},
            {"id": "st2_06", "speaker": "旁白", "text": "塔一天一天長高了。後來，媽媽生病了。"},
            {"id": "st2_07", "speaker": "媽媽", "text": "孩子們，就算媽媽不在，也要把塔蓋完喔。"},
            {"id": "st2_08", "speaker": "三兄弟", "text": "我們答應媽媽，一定會把塔蓋好！"}
          ]
        },
        {
          "id": "st3", "name": "滿願塔蓋好了", "target": "top", "hint": "點一點塔頂",
          "intro": [
            {"id": "st3_01", "speaker": "旁白", "text": "三兄弟記得媽媽的話，一起努力，終於把塔蓋好了。"},
            {"id": "st3_02", "speaker": "小弟", "text": "媽媽，您看，塔蓋好了！"}
          ],
          "outro": [
            {"id": "st3_03", "speaker": "旁白", "text": "塔放出金光，天空出現了阿彌陀佛和觀世音菩薩。"},
            {"id": "st3_04", "speaker": "媽媽", "text": "孩子們，你們做得很好。在塔前許下好心願，都會實現喔。"},
            {"id": "st3_05", "speaker": "大哥", "text": "我願當一位保護佛法的好國王。"},
            {"id": "st3_06", "speaker": "二哥", "text": "我願當一位很有力量、能幫大家趕走壞東西的修行人。"},
            {"id": "st3_07", "speaker": "小弟", "text": "我願當一位會教大家佛法的老師。"},
            {"id": "st3_08", "speaker": "旁白", "text": "後來，二哥就成了大家都認識的蓮師喔。"}
          ]
        }
      ],

function rectBookPose(rect){
  camSnap(POSE.zoom);camera.updateMatrixWorld();
  const vw=innerWidth,vh=innerHeight;
  const ndc=new V3((rect.x+rect.w/2)/vw*2-1,-((rect.y+rect.h/2)/vh*2-1),0.5);
  const dir=ndc.unproject(camera).sub(camera.position).normalize();
  const fwd=camera.getWorldDirection(new V3());
  const d=BH*vh/(2*rect.h*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)))+BT/2;
  const pos=camera.position.clone().add(dir.multiplyScalar(d/dir.dot(fwd)));
  const q=camera.quaternion.clone().multiply(new THREE.Quaternion().setFromAxisAngle(new V3(1,0,0),Math.PI/2));
  return {pos,q};
}
function flyBook(from,to,dur=1.7){const g=BOOKO.group;const o={t:0};const q=new THREE.Quaternion();
  return twp(o,{t:1,duration:dur,ease:'power2.inOut',onUpdate(){g.position.lerpVectors(from.pos,to.pos,o.t);g.position.y+=Math.sin(o.t*Math.PI)*1.2;q.copy(from.q).slerp(to.q,o.t);g.quaternion.copy(q);}});}

function speakerColor(n){return (SPEAKERS[n]&&SPEAKERS[n].color)||'#e8c36a';}
let skipFn=null,typeTimer=null;
function showSub(line){ui.who.textContent=line.speaker;ui.who.style.background=speakerColor(line.speaker);ui.sub.classList.add('show');ui.txt.textContent='';}
function hideSub(){ui.sub.classList.remove('show');clearInterval(typeTimer);}
function typewrite(text,secs){clearInterval(typeTimer);const chars=[...text];let i=0;const per=Math.max(12,secs*1000/SPEED/chars.length);typeTimer=setInterval(()=>{i++;ui.txt.textContent=chars.slice(0,i).join('');if(i>=chars.length)clearInterval(typeTimer);},per);}
function lineDuration(line){const v=VOICE.lines[line.id];if(v&&A.buffers[v.clip])return null;return Math.max(1.9,[...line.text].length*0.21+0.7);}
function say(line,{showCard=true}={}){
  const r=RUN;
  return new Promise((res,rej)=>{
    if(showCard)showSub(line);
    const v=voicePlay(line.id);const dur=v?v.dur+0.35:lineDuration(line);
    if(showCard)typewrite(line.text,Math.min(dur*0.65,2.4));
    let done=false;const fin=()=>{if(done)return;done=true;clearTimeout(t);if(skipFn===mySkip)skipFn=null;if(v)v.stop();if(showCard)ui.txt.textContent=line.text;if(r!==RUN)rej(ABORT);else res();};
    const t=setTimeout(fin,dur*1000/SPEED);const mySkip=fin;skipFn=mySkip;
  });
}

async function importGroupAudio(g,file,el){
  audioInit();const msg=el.querySelector('.msg');msg.textContent='分析中…';
  try{
    const ab=await file.arrayBuffer();const buf=await A.ctx.decodeAudioData(ab.slice(0));const b64=await fileToB64(file);
    const segs=segmentAudio(buf,g.lines.map(l=>l.text));

    const used=new Set(Object.values(VOICE.lines).map(v=>v.clip));
    g.lines.forEach(l=>{if(VOICE.lines[l.id])used.delete(VOICE.lines[l.id].clip);});
    g.lines.forEach((l,i)=>{VOICE.lines[l.id]={clip:clipId,start:+segs.segs[i][0].toFixed(3),end:+segs.segs[i][1].toFixed(3)};});
    const still=new Set(Object.values(VOICE.lines).map(v=>v.clip));VOICE.clips=VOICE.clips.filter(c=>still.has(c.id));
    VOICE.clips.push({id:clipId,name:file.name,mime:file.type||'audio/mpeg',data:b64});A.buffers[clipId]=buf;

  const wv=el.querySelector('.wave');
  if(buf){wv.hidden=false;drawWave(wv,buf,g);}
  g.lines.forEach((l,i)=>{const v=VOICE.lines[l.id];if(!v)return;const row=document.createElement('div');row.className='seg';
    row.innerHTML=`<button title="試聽">▶</button><span title="${l.text}">${i+1}. ${l.text}</span><input type="number" step="0.05" min="0" value="${v.start}"><input type="number" step="0.05" min="0" value="${v.end}">`;
    row.querySelector('button').addEventListener('click',()=>{audioInit();if(!A.buffers[v.clip]){toast('語音還在解碼，請稍候');return;}stopVoice();voicePlay(l.id);});
    const [is,ie]=row.querySelectorAll('input');const upd=()=>{v.start=Math.max(0,+is.value||0);v.end=Math.max(v.start+0.05,+ie.value||0);if(buf)drawWave(wv,buf,g);};is.addEventListener('change',upd);ie.addEventListener('change',upd);
    box.appendChild(row);});
}
function drawWave(c,buf,g){const x=c.getContext('2d'),W=c.width,H=c.height;x.clearRect(0,0,W,H);const d=buf.getChannelData(0);const step_=Math.ceil(d.length/W);x.fillStyle='rgba(159,255,208,.7)';
  for(let i=0;i<W;i++){let m=0;for(let k=i*step_;k<Math.min(d.length,(i+1)*step_);k+=4)m=Math.max(m,Math.abs(d[k]));const h=m*H;x.fillRect(i,(H-h)/2,1,Math.max(1,h));}
  g.lines.forEach((l,i)=>{const v=VOICE.lines[l.id];if(!v||!A.buffers[v.clip]||A.buffers[v.clip]!==buf)return;const a=v.start/buf.duration*W,b=v.end/buf.duration*W;x.fillStyle=i%2?'rgba(232,195,106,.22)':'rgba(120,200,255,.22)';x.fillRect(a,0,b-a,H);x.fillStyle='#ffe39a';x.font='10px sans-serif';x.fillText(String(i+1),a+2,10);});}
function segmentAudio(buf,texts){
  const sr=buf.sampleRate,n=buf.length,chs=buf.numberOfChannels;const hop=Math.round(sr*0.01);const F=Math.floor(n/hop);const rms=new Float32Array(F);
  const chd=[];for(let c=0;c<chs;c++)chd.push(buf.getChannelData(c));
  for(let f=0;f<F;f++){let s=0;for(let i=f*hop;i<(f+1)*hop;i++){let v=0;for(let c=0;c<chs;c++)v+=chd[c][i];v/=chs;s+=v*v;}rms[f]=Math.sqrt(s/hop);}
  const sorted=Array.from(rms).sort((a,b)=>a-b);const noise_=sorted[Math.floor(F*0.1)]||0,peak=sorted[Math.floor(F*0.98)]||0.1;const thr=Math.max(0.0015,noise_+(peak-noise_)*0.07);
  const runs=[];let st=-1;for(let f=0;f<=F;f++){const sil=f<F&&rms[f]<thr;if(sil&&st<0)st=f;if(!sil&&st>=0){runs.push([st,f]);st=-1;}}
  let sp0=0,sp1=F;if(runs.length&&runs[0][0]===0){sp0=runs[0][1];}if(runs.length&&runs[runs.length-1][1]>=F){sp1=runs[runs.length-1][0];}
  const minSil=18;let cands=runs.filter(r=>r[0]>sp0&&r[1]<sp1&&(r[1]-r[0])>=minSil).map(r=>({s:r[0]*0.01,e:r[1]*0.01,len:(r[1]-r[0])*0.01}));
  const found=cands.length;const S0=sp0*0.01,S1=sp1*0.01,N=texts.length;
  const w=texts.map(t=>{let k=0;for(const ch of t)k+=/[，。！？、…「」：；,.!?]/.test(ch)?0.6:1;return Math.max(1,k);});const Wt=w.reduce((a,b)=>a+b,0);
  if(N===1)return {segs:[[Math.max(0,S0-0.05),Math.min(buf.duration,S1+0.1)]],found};
  const total=S1-S0;const exp=w.map(x=>total*x/Wt);
  if(cands.length<N-1){let cum=0;for(let j=0;j<N-1;j++){cum+=w[j];const p=S0+total*cum/Wt;if(!cands.some(c=>Math.abs((c.s+c.e)/2-p)<0.25))cands.push({s:p-0.01,e:p+0.01,len:0,syn:true});}cands.sort((a,b)=>a.s-b.s);}
  const K=cands.length,maxL=Math.max(0.01,...cands.map(c=>c.len));const B=0.55;
  const seg=(a,b,j)=>{const d=b-a;if(d<=0.05)return 1e6;const r=(d-exp[j])/exp[j];return r*r;};
  const dp=Array.from({length:N},()=>new Float64Array(K).fill(Infinity)),bk=Array.from({length:N},()=>new Int32Array(K).fill(-1));
  for(let k=0;k<K;k++)dp[1][k]=seg(S0,cands[k].s,0)-B*cands[k].len/maxL;
  for(let j=2;j<=N-1;j++)for(let k=j-1;k<K;k++){let best=Infinity,bi=-1;for(let p=j-2;p<k;p++){const v=dp[j-1][p];if(v===Infinity)continue;const c=v+seg(cands[p].e,cands[k].s,j-1);if(c<best){best=c;bi=p;}}if(bi>=0){dp[j][k]=best-B*cands[k].len/maxL;bk[j][k]=bi;}}
  let best=Infinity,bk_=-1;for(let k=N-2;k<K;k++){const v=dp[N-1][k];if(v===Infinity)continue;const c=v+seg(cands[k].e,S1,N-1);if(c<best){best=c;bk_=k;}}
  if(bk_<0){const segs=[];let cum=0;for(let j=0;j<N;j++){const a=S0+total*cum/Wt;cum+=w[j];segs.push([Math.max(0,a-0.05),Math.min(buf.duration,S0+total*cum/Wt+0.05)]);}return {segs,found};}
  const cuts=[];let k=bk_;for(let j=N-1;j>=1;j--){cuts.unshift(cands[k]);k=bk[j][k];}
  const segs=[];for(let j=0;j<N;j++){const a=j===0?Math.max(0,S0-0.05):Math.max(0,cuts[j-1].e-0.08);const b=j===N-1?Math.min(buf.duration,S1+0.12):Math.min(buf.duration,cuts[j].s+0.1);segs.push([a,b]);}
  return {segs,found,cuts};
}
